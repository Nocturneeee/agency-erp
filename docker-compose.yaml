services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: agency_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d agency_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: